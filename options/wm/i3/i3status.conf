# i3status config for DebPlus. Installed to /etc/i3status.conf.
general {
	colors = true
	interval = 5
}

order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "tztime local"

wireless _first_ {
	format_up = "W: %essid %quality"
	format_down = "W: down"
}

ethernet _first_ {
	format_up = "E: %ip"
	format_down = "E: down"
}

battery all {
	format = "%status %percentage"
	format_down = ""
}

tztime local {
	format = "%H:%M"
}
